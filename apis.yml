---
aid: ucla
name: University of California, Los Angeles
description: >-
  The University of California, Los Angeles is a public land-grant research university in the
  University of California system, ranked 29th in the QS World University Rankings, and it is one
  of the few institutions in this cohort that genuinely runs a central API program rather than
  renting one. UCLA operates its own API gateway at api.ucla.edu, fronted by Apigee under a
  certificate issued to the university, and a Drupal/Apigee developer portal at
  developer.api.ucla.edu that catalogues eight API products. Seven of those products publish a
  real machine-readable contract, anonymously downloadable, and all seven describe routes on
  UCLA's own gateway - six Swagger 2.0 contracts covering the student information system
  (classes, class sections, courses, GE foundations, a 61-operation Registrar data dictionary,
  the mainframe production calendar, a connectivity health check and the MyUCLA portal menu) plus
  one OpenAPI 3.0.3 contract for a campus weather station. Ninety-one operations in total, every
  one of them a read. UCLA also runs its own Shibboleth identity provider, registered by InCommon
  under entityID urn:mace:incommon:ucla.edu with REFEDS Research & Scholarship and SIRTFI
  certification - the most complete machine-readable artifact the university publishes, and the
  one no API catalogue had looked at. UCLA Library self-hosts a Cantaloupe IIIF image server, a
  Hyrax digital collections platform and a Dataverse instance, all on ucla.edu hosts under UCLA's
  own TLS certificates. What UCLA does not have is any way in: every credential requires a UCLA
  logon and a human approval, there is no self-service path, no status page, no changelog, no
  llms.txt, no machine-readable catalog index, and no rate-limit or error documentation. The
  learning management system, BruinLearn, is Instructure Canvas on a vanity subdomain and is
  recorded as a tenant relationship rather than as UCLA engineering.
type: Index
