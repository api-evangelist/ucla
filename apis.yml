- aid: ucla:library-iiif
  name: UCLA Library IIIF Image Service
  description: >-
    UCLA Library self-hosts a Cantaloupe 5.0.5 image server exposing both IIIF Image API 2.x and 3.0 endpoints
    for its digital collections. Institution-operated on UCLA's own AWS infrastructure under a UCLA-issued
    certificate, not a vendor platform. Live but effectively unreadable from outside - every identifier
    probed, including a deliberate nonsense control, returned 403 with a Java stack trace naming the private
    S3 source bucket, so no manifest or info.json could be retrieved and none is claimed.
