- aid: ucla:dataverse
  name: UCLA Dataverse
  description: >-
    UCLA's research data repository, running open-source Dataverse on a UCLA-owned host under a UCLA-issued
    certificate with no vendor CNAME - which distinguishes it from the Figshare and Elsevier Pure tenancies
    that dominate this cohort. Recorded as a relationship rather than a contract because the host answers
    HTTP 200 with an Anubis bot challenge to every path including /api/info/version and /oai, so neither
    the Dataverse version, the DOI prefix nor OAI-PMH conformance could be confirmed, and none is claimed.
  humanURL: https://dataverse.ucla.edu/
  baseURL: https://dataverse.ucla.edu/api
