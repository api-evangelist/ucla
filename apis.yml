- aid: ucla:bruinlearn
  name: BruinLearn (Canvas LMS)
  description: >-
    UCLA's learning management system. The brand, the courses, the learners and the subdomain are UCLA's;
    the REST API, the LTI 1.3 implementation, the key rotation and the contract are Instructure's, and
    bruinlearn.ucla.edu CNAMEs to ucla-vanity.instructure.com. The LTI tool-platform JWKS is anonymously
    readable and the REST API returns a structured 401. Recorded as a tenant relationship; no Canvas contract
    is saved under this institution.
  humanURL: https://bruinlearn.ucla.edu/
  baseURL: https://bruinlearn.ucla.edu/api/v1
  tags:
  - Learning Management
  - LTI
  - Course Delivery
  - Canvas
