x-coverage:
  state: gated
  reason: approval_required_no_self_service
  detail: >-
    UCLA is the strongest institution-operated API program measured in this cohort so far and it
    is still not consumable. Seven real OpenAPI contracts covering 91 operations are anonymously
    downloadable from the developer portal, and every route they describe is live on UCLA's own
    Apigee gateway - a documented SIS path returns 401 with oauth.v2.InvalidAccessToken and a
    conformant RFC 6750 Bearer challenge, which proves the contracts describe real endpoints. But
    a credential exists only after a developer signs in with a UCLA logon, creates an App, selects
    an API Product and a campus unit approves the request. There is no public registration, no
    sandbox, no trial key. The portal states plainly that most APIs are only visible after log on,
    so the eight catalogued products are a subset of an unknown whole. Two secondary limits are
    recorded rather than treated as findings about UCLA - dataverse.ucla.edu and
    digital.library.ucla.edu both answer 200 with an Anubis proof-of-work bot challenge on every
    path, so OAI-PMH, Dataverse version and DOI prefix could not be read and are not claimed; and
    UCLA Library's Cantaloupe IIIF server answers 403 with a stack trace for every identifier
    including a deliberate nonsense control, so no manifest could be retrieved. This is a correct
    gated profile, not a failed probe - roughly 60 URLs were fetched successfully across 15 hosts,
    including 7 contracts, signed federation metadata and 3 live error surfaces.
  evidence:
  - url: https://developer.api.ucla.edu/api-catalog
    status: 200
    note: Eight API products listed; three of them (51, 346, 1446) were absent from the June profile.
  - url: https://developer.api.ucla.edu/sites/default/files/apidoc_specs/classes_v1_4.json
    status: 200
  - url: https://developer.api.ucla.edu/sites/default/files/apidoc_specs/courses_v1%20%281%29_0.json
    status: 200
  - url: https://developer.api.ucla.edu/sites/default/files/apidoc_specs/dictionary_v1%20%281%29.json
    status: 200
  - url: https://developer.api.ucla.edu/sites/default/files/apidoc_specs/productioncalendarjobs_v1_0.json
    status: 200
  - url: https://developer.api.ucla.edu/sites/default/files/apidoc_specs/_infrastructure_verifyconnectivity_v1.json
    status: 200
  - url: https://developer.api.ucla.edu/sites/default/files/apidoc_specs/_myucla_menudata_v1.json
    status: 200
  - url: https://developer.api.ucla.edu/sites/default/files/apidoc_specs/UCLAWeather_3.yaml
    status: 200
  - url: https://api.ucla.edu/sis/dictionary/buildings/v1
    status: 401
    note: oauth.v2.InvalidAccessToken with an RFC 6750 Bearer challenge; the gateway is live and enforcing.
  - url: https://api.ucla.edu/weather/api
    status: 401
  - url: https://api.ucla.edu/oauth/client_credential/accesstoken
    status: 200
  - url: https://api.ucla.edu/nonexistentpath
    status: 500
    note: 'Plain-text "Unauthorized by UCLA API Gateway. Invalid Config Data" on every unrouted path; should be 404.'
  - url: https://qa.api.ucla.edu/
    status: 404
    note: QA returns a structured ApplicationNotFound fault where production returns a 500.
  - url: https://mdq.incommon.org/entities/urn%3Amace%3Aincommon%3Aucla.edu
    status: 200
    note: Signed SAML metadata for UCLA's own Shibboleth IdP; REFEDS R&S and SIRTFI.
  - url: https://met.refeds.org/met/entity/urn:mace:incommon:ucla.edu/
    status: 200
  - url: https://bruinlearn.ucla.edu/api/lti/security/jwks
    status: 200
    note: Tenant surface — Instructure Canvas on a UCLA vanity subdomain.
  - url: https://bruinlearn.ucla.edu/api/v1/accounts
    status: 401
  - url: https://dataverse.ucla.edu/api/info/version
    status: 200
    note: Anubis bot-challenge body, not a Dataverse response; unreadable, not credited.
  - url: https://dataverse.ucla.edu/oai?verb=Identify
    status: 200
    note: Anubis bot-challenge body; OAI-PMH conformance neither confirmed nor denied.
  - url: https://digital.library.ucla.edu/catalog/oai?verb=Identify
    status: 200
    note: Anubis bot-challenge body; not credited.
  - url: https://iiif.library.ucla.edu/
    status: 200
    note: Cantaloupe 5.0.5 landing page; IIIF Image API 2.x and 3.0 endpoints advertised.
  - url: https://iiif.library.ucla.edu/iiif/2/bogus-identifier/info.json
    status: 403
    note: >-
      Negative control. Identical stack-trace body to a plausible real identifier, so a 403 here
      is never evidence an object exists. Also leaks the private S3 bucket name.
  - url: https://api.ucla.edu/
    status: 500
  - url: https://data.ucla.edu/
    status: 0
    note: Does not resolve; UCLA operates no open-data portal at the conventional hostname.
  - url: https://developer-pilot.api.ucla.edu/
    status: 0
    note: Pilot portal recorded in the June 2026 profile still does not resolve from outside campus.
  - url: https://weather.atmos.ucla.edu/
    status: 0
    note: >-
      Referenced by info.description in UCLA's own Weather contract. Resolves in DNS but accepts
      no connection; dead pointer, removed rather than carried.
  - url: https://www.ucla.edu/llms.txt
    status: 404
  - url: https://developer.api.ucla.edu/.well-known/security.txt
    status: 404
  - url: https://escholarship.org/oai?verb=ListSets
    status: 200
    note: >-
      UC systemwide repository operated by the California Digital Library. ListSets returns a
      single set, "everything", with no UCLA-specific set, so nothing here is attributable to
      UCLA and no entry is recorded for it.
  - url: https://it.ucla.edu/privacy
    status: 200
    note: Soft-404 — redirects to the dts.ucla.edu homepage; not claimed as a pointer.
  assessed: '2026-08-19'
  method: university pipeline live probe sweep
  added: 6
  added_detail: >-
    Six surfaces were added that the June 2026 profile missed: the Verify Connectivity to SIS and
    UCLA Weather API products, the Shibboleth identity provider, UCLA Dataverse, UCLA Library
    Digital Collections and the BruinLearn tenancy. Seven OpenAPI contracts were retrieved for
    the first time; the June profile recorded documentation pointers only and held no contract at
    all. All seven were found by reading the swaggerUIFormatter block out of the portal's
    drupal-settings-json, because UCLA publishes no machine-readable index of its own catalog.
  removed: 0
  removed_detail: >-
    Nothing was removed. The correct-university-attribution pass found no vendor-attributed
    contract in this repository to strip - UCLA had none, because the June profile had saved no
    contracts at all. The one reclassification is BruinLearn, newly recorded as x-operator tenant
    rather than credited to UCLA.
