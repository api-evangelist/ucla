description: >-
  Identity federation is the surface class universities operate by definition and almost never
  get catalogued for, and at UCLA it is the single most complete institution-owned
  machine-readable artifact the university publishes. UCLA runs its own Shibboleth identity
  provider at shb.ais.ucla.edu, is registered by InCommon under entityID
  urn:mace:incommon:ucla.edu, asserts the InCommon and REFEDS Research & Scholarship entity
  categories, and carries a SIRTFI assurance certification - a public commitment to a defined
  security-incident response posture with a named contact. Everything below was read from the
  signed metadata, not from a UCLA web page.
