assessment: >-
  This is a well-run federation entry by any measure: signed, current, scoped, categorised, and
  carrying a real security contact. It is also the clearest illustration of the university
  pipeline's central point - the most credible machine-readable thing UCLA publishes is not on
  its developer portal, it is in a federation metadata aggregate that no API catalogue has ever
  looked at.
gaps:
