description: >-
  UCLA is a non-commercial higher-education institution and does not sell API access. There is no
  price, no tier and no meter anywhere on the developer portal. Access to all seven published
  contracts is free of charge but is not free of process: a developer signs in with a UCLA logon,
  creates an App, subscribes it to one or more API Products, and a campus unit approves the
  request. There is no public registration, no sandbox and no trial credential, so the practical
  plan for an unaffiliated caller is "none". The only genuinely open UCLA surface is the signed
  SAML metadata for its identity provider, which requires no credential at all.
notes: >-
  Verified 2026-08-19. "Free / Open" applies only to anonymously readable metadata (the seven
  OpenAPI documents themselves and the InCommon SAML metadata). "Affiliation / Credentialed"
  applies to every callable endpoint. Access requests go through
  https://developer.api.ucla.edu/ and api-support@it.ucla.edu.
