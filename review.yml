- date: '2026-08-19'
  rating: 6
  reviewer: API Evangelist university pipeline
  summary: >-
    Re-profiled under the university pipeline, which settles operator attribution before saving
    anything. The June review's central conclusion - that UCLA gates everything and publishes no
    base URLs - was half right and materially incomplete. UCLA does gate everything, but it also
    publishes seven complete OpenAPI contracts anonymously, and the June pass did not find them
    because the portal exposes no machine-readable index: each specification URL lives inside the
    swaggerUIFormatter block of the page's drupal-settings-json. Reading those eight pages yielded
    contracts for Classes, Courses, Dictionary, Production Calendar Jobs, MyUCLA Menu Data, a
    previously unrecorded Verify Connectivity to SIS product, and a previously unrecorded UCLA
    Weather API - 91 operations, all GET, all on api.ucla.edu, which CNAMEs to ucla-prod.apigee.net
    under a certificate issued to O=University of California, Los Angeles. A documented SIS route
    answers 401 with oauth.v2.InvalidAccessToken and an RFC 6750 Bearer challenge, so the contracts
    describe endpoints that genuinely exist. The largest find is outside the portal entirely: UCLA
    runs its own Shibboleth identity provider, registered by InCommon under entityID
    urn:mace:incommon:ucla.edu, signed, scoped to ucla.edu, carrying REFEDS Research & Scholarship
    and a SIRTFI assurance certification with security@it.ucla.edu named as its contact. Three
    contract defects are worth reporting back to UCLA: 462 response keys across the six SIS
    contracts are declared with a leading space and are therefore invisible to conformant
    validators; the production gateway answers 500 with plain text on any unrouted path where QA
    correctly answers 404; and UCLA Library's Cantaloupe IIIF server returns a Java stack trace
    naming its private S3 bucket on every 403, including for a nonsense identifier. Nothing was
    removed - unusually for this cohort, UCLA held no vendor-attributed contract, because the June
    profile had saved no contracts at all. BruinLearn was newly recorded as a tenant relationship
    (Instructure Canvas on a vanity subdomain) rather than credited to UCLA.
